<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Foliogram — Analytics</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Foliogram</h1>
      <a class="navlink" href="welcome.html">Dashboard</a>
      <a class="navlink active" href="analytics.html">Analytics</a>
    </aside>

    <main class="container">
      <div class="topbar">
        <div class="page-title">Analytics</div>
      </div>

      <section class="grid cols-2">
        <div class="card">
          <h4>Visits (last 7 days)</h4>
          <div style="margin-top:12px">
            <div class="small">Mon — 30</div>
            <div class="small">Tue — 45</div>
            <div class="small">Wed — 28</div>
            <div class="small">Thu — 60</div>
            <div class="small">Fri — 55</div>
            <div class="small">Sat — 70</div>
            <div class="small">Sun — 40</div>
          </div>
        </div>

        <div class="card">
          <h4>Summary</h4>
          <p class="small">KPIs and quick stats would go here in a dynamic version.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>

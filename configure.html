<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Foliogram — Configure</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Foliogram</h1>
      <a class="navlink" href="templates.html">Templates</a>
      <a class="navlink active" href="configure.html">Builder</a>
      <a class="navlink" href="welcome.html">Dashboard</a>
    </aside>

    <main class="container">
      <div class="topbar">
        <div class="page-title">Portfolio Builder</div>
      </div>

      <section class="card" style="max-width:880px">
        <h3>Basic info</h3>
        <div class="form-row">
          <label class="small">Portfolio Title</label>
          <input class="input" type="text" placeholder="e.g. Portfolio of Jane Doe" />
        </div>

        <div class="form-row">
          <label class="small">Short summary</label>
          <textarea rows="4" class="input" placeholder="Summary for your portfolio"></textarea>
        </div>

        <div class="form-row">
          <label class="small">Choose template</label>
          <select class="input">
            <option>Clean Studio</option>
            <option>Classic Portfolio</option>
            <option>Creative Grid</option>
          </select>
        </div>

        <div style="margin-top:12px">
          <a class="button" href="portfolio.html">Save & Preview</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Foliogram — Sign up</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Foliogram</h1>
      <a class="navlink" href="index.html">Login</a>
      <a class="navlink active" href="signup.html">Sign up</a>
      <a class="navlink" href="welcome.html">Dashboard</a>
      <a class="navlink" href="templates.html">Templates</a>
      <a class="navlink" href="configure.html">Builder</a>
      <a class="navlink" href="portfolio.html">Public portfolio</a>
    </aside>

    <main class="container">
      <div class="topbar">
        <div class="page-title">Create Account</div>
      </div>

      <section class="card" style="max-width:520px">
        <form action="welcome.html" method="get">
          <div class="form-row">
            <label class="small">Full name</label>
            <input class="input" type="text" required placeholder="Your name" />
          </div>
          <div class="form-row">
            <label class="small">Email</label>
            <input class="input" type="email" required placeholder="you@example.com" />
          </div>
          <div class="form-row">
            <label class="small">Password</label>
            <input class="input" type="password" required />
          </div>

          <div style="display:flex; gap:10px">
            <button class="button">Create account</button>
            <a class="button secondary" href="index.html">Back to login</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
